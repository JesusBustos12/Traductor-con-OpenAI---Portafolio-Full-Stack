<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate — Traductor IA con OpenAI</title>
    
    <!-- Metaetiquetas Básicas -->
    <meta name="description" content="Traductor inteligente y rápido impulsado por OpenAI. Traduce tus textos a inglés, español, francés, italiano, alemán, japonés, ruso y más idiomas al instante con tecnología IA.">
    <meta name="keywords" content="traductor, traductor IA, OpenAI, traductor inteligente, inteligencia artificial, traducir idiomas, traductor online, Jesus Bustos">
    <meta name="author" content="Jesus Bustos Arizmendi">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0F172A">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://traductor-con-open-ai-portafolio-fu.vercel.app/">
    <meta property="og:title" content="Translate — Traductor IA con OpenAI">
    <meta property="og:description" content="Traductor inteligente y rápido impulsado por OpenAI. Traduce textos a múltiples idiomas al instante.">
    <meta property="og:image" content="https://traductor-con-open-ai-portafolio-fu.vercel.app/Assets/Imgs/traductor.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://traductor-con-open-ai-portafolio-fu.vercel.app/">
    <meta property="twitter:title" content="Translate — Traductor IA con OpenAI">
    <meta property="twitter:description" content="Traductor inteligente y rápido impulsado por OpenAI. Traduce textos a múltiples idiomas al instante.">
    <meta property="twitter:image" content="https://traductor-con-open-ai-portafolio-fu.vercel.app/Assets/Imgs/traductor.png">

    <!-- Enlace Canónico -->
    <link rel="canonical" href="https://traductor-con-open-ai-portafolio-fu.vercel.app/" />

    <!-- Recursos y Estilos -->
    <link rel="stylesheet" href="./Assets/CSS/styles.css"/>
    <link rel="icon" type="image/png" href="./Assets/Imgs/traductor.png"/>
    <script src="./Assets/Js/main.js" defer></script>
</head>

<body>

    <main class="layout">

        <header class="layout__header">
            <div class="header__brand">
                <img id="img" src="./Assets/Imgs/traductor.png" alt="Ícono de traducción de idiomas"/>
                <h1 id="title">Translate</h1>
            </div>
            <div id="limitBadge" class="limit-badge" aria-live="polite">
                <span id="limitCount">20</span> / 20<br>
                <small>Restantes</small>
            </div>
        </header>

        <section class="layout__chat">

            <div class="chat__messages" role="log" aria-live="polite" aria-label="Historial de traducciones">

            </div>

            <div class="chat__inputs">

                <label for="inputText" class="sr-only">Texto a traducir</label>
                <input type="text" id="inputText" placeholder="Escribe algo para traducir..." maxlength="500" autocomplete="off"/>
                <span id="charCounter" class="char-counter">0 / 500</span>

                <div class="inputs__content">

                    <label for="targetLang" class="sr-only">Idioma de destino</label>
                    <select id="targetLang" aria-label="Seleccionar idioma de destino">

                        <option value="english">English</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="italian">Italian</option>
                        <option value="german">German</option>
                        <option value="japanese">Japanese</option>
                        <option value="russian">Russian</option>
                        <option value="portuguese">Portuguese</option>
                        <option value="chinese">Chinese</option>
                        <option value="korean">Korean</option>

                    </select>

                    <button type="button" id="btn" aria-label="Traducir texto">Translate</button>

                </div>

            </div>

        </section>

        <footer class="layout__footer">
            <p>Powered by OpenAI — Desarrollado por Jesús Bustos</p>
        </footer>

    </main>

</body>

</html>
